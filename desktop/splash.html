<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>Cadence</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7f8; --fg: #18181b; --muted: #71717a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --fg: #f4f4f5; --muted: #a1a1aa; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .box { text-align: center; }
  svg { display: block; margin: 0 auto 18px; }
  p { margin: 4px 0 0; color: var(--muted); }
  .bar { width: 160px; height: 3px; margin: 22px auto 0; border-radius: 3px; background: color-mix(in oklab, var(--fg) 12%, transparent); overflow: hidden; }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #B9A7FF, #6FD3FF); animation: go 1.1s ease-in-out infinite; }
  @keyframes go { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
</head>
<body>
  <div class="box">
    <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="9" fill="currentColor"/>
      <path d="M8.5 19.5c2.2-5 4.4-7.5 6.6-7.5 3.3 0 3.3 8 6.4 8 1 0 2-.7 3-2" stroke="url(#g)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <defs><linearGradient id="g" x1="8" x2="25" y1="16" y2="16"><stop stop-color="#B9A7FF"/><stop offset="1" stop-color="#6FD3FF"/></linearGradient></defs>
    </svg>
    <strong>Cadence</strong>
    <p>Démarrage de votre espace…</p>
    <div class="bar"></div>
  </div>
</body>
</html>
